name: CI · 单元测试与运行时校验

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-runtime-tests:
    name: Python 模型 + Node 运行时测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install CPU PyTorch & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy pillow tqdm

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Check runtime ES modules syntax & loader/pacer tests
        run: |
          for f in runtime/*.js; do
            node --check "$f"
          done
          node --test tests/test_runtime_node.mjs
