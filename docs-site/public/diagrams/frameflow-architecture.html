<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FrameFlow 架构全景交互图谱</title>
  <script>
    (function () {
      var q = new URLSearchParams(window.location.search);
      var t = q.get('theme');
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
      if (q.get('stage') === '1') document.documentElement.setAttribute('data-stage', '1');
    })();
  </script>
  <style>
    :root, html[data-theme="dark"] {
      --bg: #080d18;
      --grid: rgba(56, 189, 248, 0.06);
      --panel: rgba(15, 23, 42, 0.9);
      --border: rgba(148, 163, 184, 0.24);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --ok: #34d399;
      --warn: #fbbf24;
      --edge: rgba(148, 163, 184, 0.52);
    }
    html[data-theme="light"] {
      --bg: #f8fafc;
      --grid: rgba(12, 92, 171, 0.055);
      --panel: rgba(255, 255, 255, 0.94);
      --border: rgba(15, 23, 42, 0.14);
      --text: #0f172a;
      --muted: #475569;
      --accent: #0c5cab;
      --accent-soft: rgba(12, 92, 171, 0.1);
      --ok: #059669;
      --warn: #d97706;
      --edge: rgba(71, 85, 105, 0.5);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text);
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
    }
    .canvas-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .svg-stage {
      flex: 1 1 auto;
      min-height: 0;
      cursor: grab;
      touch-action: none;
    }
    .svg-stage.dragging { cursor: grabbing; }
    svg { width: 100%; height: 100%; display: block; }
    .node { cursor: pointer; transition: filter 0.18s ease; }
    .node:hover rect.box, .node:focus-visible rect.box { stroke: var(--accent); stroke-width: 2; }
    .node.active rect.box { stroke: var(--accent); stroke-width: 2.2; fill: var(--accent-soft); }
    rect.box { fill: var(--panel); stroke: var(--border); stroke-width: 1.3; rx: 10; }
    .node-kicker { fill: var(--accent); font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .node-title { fill: var(--text); font-size: 13px; font-weight: 700; }
    .node-sub { fill: var(--muted); font-size: 11px; font-family: "JetBrains Mono", ui-monospace, monospace; }
    .edge-line { fill: none; stroke: var(--edge); stroke-width: 1.8; marker-end: url(#arrow); }
    .edge-label { fill: var(--muted); font-size: 10.5px; text-anchor: middle; }
    .inspector {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(8px);
      font-size: 12px;
      line-height: 1.4;
    }
    .inspector-main { min-width: 0; flex: 1; }
    .inspector-title { font-weight: 700; color: var(--accent); margin-right: 8px; }
    .inspector-file { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; padding: 1px 6px; border-radius: 5px; background: var(--accent-soft); color: var(--text); }
    .inspector-desc { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .controls { display: flex; gap: 4px; flex-shrink: 0; }
    .ctrl-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <div class="canvas-wrap">
    <div id="stage" class="svg-stage">
      <svg id="svg" viewBox="0 0 940 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FrameFlow architecture diagram">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
            <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="currentColor" opacity="0.65" />
          </marker>
        </defs>
        <g id="viewport">
          <!-- Group frames -->
          <rect x="20" y="20" width="215" height="288" rx="14" fill="none" stroke="rgba(148,163,184,0.22)" stroke-dasharray="5 4" />
          <text x="34" y="42" class="node-kicker">Python 训练与导出 (PyTorch)</text>

          <rect x="262" y="20" width="420" height="288" rx="14" fill="none" stroke="rgba(56,189,248,0.28)" stroke-dasharray="5 4" />
          <text x="276" y="42" class="node-kicker">零依赖浏览器运行时 (runtime/*.js)</text>

          <rect x="708" y="20" width="212" height="288" rx="14" fill="none" stroke="rgba(16,185,129,0.28)" stroke-dasharray="5 4" />
          <text x="722" y="42" class="node-kicker">宿主与零拷贝呈现</text>

          <!-- Edges -->
          <path d="M 222 100 L 278 100" class="edge-line" />
          <text x="250" y="92" class="edge-label">v1 产物</text>

          <path d="M 222 222 L 278 222" class="edge-line" />
          <text x="250" y="214" class="edge-label">校验压缩</text>

          <path d="M 455 100 L 485 100" class="edge-line" />
          <path d="M 575 138 L 575 170" class="edge-line" />
          <text x="604" y="158" class="edge-label">自动降级</text>

          <path d="M 666 105 L 722 105" class="edge-line" />
          <path d="M 666 225 L 722 225" class="edge-line" />

          <!-- Nodes -->
          <g class="node active" tabindex="0" role="button" data-id="export">
            <rect class="box" x="34" y="60" width="188" height="82" />
            <text x="48" y="82" class="node-kicker">1. 模型导出层</text>
            <text x="48" y="102" class="node-title">GameFI + GameSR</text>
            <text x="48" y="121" class="node-sub">graph.json / f16 .bin</text>
          </g>

          <g class="node" tabindex="0" role="button" data-id="data">
            <rect class="box" x="34" y="176" width="188" height="92" />
            <text x="48" y="198" class="node-kicker">2. 数据与合规打包</text>
            <text x="48" y="218" class="node-title">CC-BY / HUD / KD</text>
            <text x="48" y="237" class="node-sub">prepare_* + package_release</text>
            <text x="48" y="254" class="node-sub">SHA256SUMS + DATA_PROVENANCE</text>
          </g>

          <g class="node" tabindex="0" role="button" data-id="loader">
            <rect class="box" x="278" y="60" width="177" height="82" />
            <text x="292" y="82" class="node-kicker">3. 解析与静态规划</text>
            <text x="292" y="102" class="node-title">parseModel + compilePlan</text>
            <text x="292" y="121" class="node-sub">f16ToF32 · align32 · FiLM</text>
          </g>

          <g class="node" tabindex="0" role="button" data-id="pacer">
            <rect class="box" x="278" y="176" width="177" height="92" />
            <text x="292" y="198" class="node-kicker">4. 零回读节拍器</text>
            <text x="292" y="218" class="node-title">FrameFlowPacer</text>
            <text x="292" y="237" class="node-sub">2x / 3x · EMA 4-200ms</text>
            <text x="292" y="254" class="node-sub">drop > factor + 2</text>
          </g>

          <g class="node" tabindex="0" role="button" data-id="webgpu">
            <rect class="box" x="485" y="60" width="181" height="78" />
            <text x="499" y="82" class="node-kicker">5a. 首选 GPU 后端</text>
            <text x="499" y="102" class="node-title">WebGPU Compute</text>
            <text x="499" y="121" class="node-sub">shader-f16 -> f32 · WGSL</text>
          </g>

          <g class="node" tabindex="0" role="button" data-id="webgl2">
            <rect class="box" x="485" y="170" width="181" height="98" />
            <text x="499" y="192" class="node-kicker">5b. 全浏览器兜底</text>
            <text x="499" y="212" class="node-title">WebGL2 Fragment</text>
            <text x="499" y="231" class="node-sub">RGBA16F TEXTURE_2D_ARRAY</text>
            <text x="499" y="248" class="node-sub">4-Target MRT · 4n ch</text>
          </g>

          <g class="node" tabindex="0" role="button" data-id="pvsspw">
            <rect class="box" x="722" y="60" width="184" height="86" />
            <text x="736" y="82" class="node-kicker">6a. 共享 GPUDevice</text>
            <text x="736" y="102" class="node-title">PVSSPW / Canvas</text>
            <text x="736" y="121" class="node-sub">GameFI -> GameSR -> Swap</text>
          </g>

          <g class="node" tabindex="0" role="button" data-id="ppsspw">
            <rect class="box" x="722" y="176" width="184" height="92" />
            <text x="736" y="198" class="node-kicker">6b. 共享 WebGL2</text>
            <text x="736" y="218" class="node-title">PPSSPW / WebGL FBO</text>
            <text x="736" y="237" class="node-sub">flipSrcY · zero CPU fallback</text>
          </g>
        </g>
      </svg>
    </div>
    <div class="inspector">
      <div class="inspector-main">
        <span id="ins-title" class="inspector-title">1. 模型导出层</span>
        <span id="ins-file" class="inspector-file">frameflow/export.py · sr_export.py</span>
        <span id="ins-desc" class="inspector-desc">导出 format_version=1 三文件产物（graph.json + model.json + binary16 model.bin），通道数为 4 的倍数以对齐双后端。</span>
      </div>
      <div class="controls">
        <button type="button" class="ctrl-btn" id="zoom-out" title="缩小">−</button>
        <button type="button" class="ctrl-btn" id="zoom-reset" title="重置视图">1:1</button>
        <button type="button" class="ctrl-btn" id="zoom-in" title="放大">+</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var details = {
        export: {
          title: '1. 模型导出层 (GameFI / GameSR)',
          file: 'frameflow/export.py · sr_export.py',
          desc: '导出 format_version=1 三文件产物，隐层通道严格校验为 4 的倍数；GameSRNet 固定 2× 像素重排超分。'
        },
        data: {
          title: '2. 开放许可数据与合规打包',
          file: 'scripts/prepare_data.py · package_release.py',
          desc: '纯 CC-BY / Xiph / SYNLA MIT / 合成 HUD，按 SHA1 95/5 切分并随包写入 DATA_PROVENANCE.json 与五份许可文本。'
        },
        loader: {
          title: '3. 加载校验与静态计划编译',
          file: 'runtime/loader.js',
          desc: '检查 binary16 偶字节与张量越界，展开 repeat 循环为 pairSteps 与 midSteps，并将工作宽高 align32 对齐。'
        },
        pacer: {
          title: '4. 无阻塞帧节拍调度',
          file: 'runtime/pacer.js',
          desc: '跟踪 4-200ms 源帧 EMA 间隔，按 2x/3x 排入 mid(t) 任务；积压超出 factor+2 主动淘汰，热路径无 mapAsync。'
        },
        webgpu: {
          title: '5a. WebGPU Compute 首选后端',
          file: 'runtime/webgpu-backend.js',
          desc: '自动请求 shader-f16（不支持则无感退回 f32），支持接管外部 GPUDevice 与 setExternalInputTexture 零拷贝。'
        },
        webgl2: {
          title: '5b. WebGL2 RGBA16F + MRT 兜底',
          file: 'runtime/webgl2-backend.js',
          desc: '以 RGBA16F 二维纹理数组与四目标 MRT 执行等价卷积和反向翘曲；若连半浮点 FBO 都不支持则拒绝且无 CPU 兜底。'
        },
        pvsspw: {
          title: '6a. PVSSPW / WebGPU 同设备接入',
          file: 'runtime/index.js · docs-site/docs/integration.md',
          desc: '插帧 pair/mid 始终置于空间超分之前执行，输出纹理直接交还 Swapchain 或下游 GameSR/FSR 1。'
        },
        ppsspw: {
          title: '6b. PPSSPW / WebGL2 同上下文接入',
          file: 'runtime/index.js · runtime/types.d.ts',
          desc: '传入 { backend: webgl2, gl, flipSrcY: true }，复用 FBO 纹理而不产生跨 API 回读。'
        }
      };
      var nodes = document.querySelectorAll('.node');
      var tEl = document.getElementById('ins-title');
      var fEl = document.getElementById('ins-file');
      var dEl = document.getElementById('ins-desc');
      nodes.forEach(function (n) {
        function activate() {
          nodes.forEach(function (x) { x.classList.remove('active'); });
          n.classList.add('active');
          var item = details[n.getAttribute('data-id')];
          if (item) { tEl.textContent = item.title; fEl.textContent = item.file; dEl.textContent = item.desc; }
        }
        n.addEventListener('click', activate);
        n.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } });
      });

      var vp = document.getElementById('viewport');
      var stage = document.getElementById('stage');
      var scale = 1, tx = 0, ty = 0, dragging = false, sx = 0, sy = 0;
      function apply() { vp.setAttribute('transform', 'translate(' + tx + ',' + ty + ') scale(' + scale + ')'); }
      document.getElementById('zoom-in').onclick = function () { scale = Math.min(2.2, scale + 0.18); apply(); };
      document.getElementById('zoom-out').onclick = function () { scale = Math.max(0.7, scale - 0.18); apply(); };
      document.getElementById('zoom-reset').onclick = function () { scale = 1; tx = 0; ty = 0; apply(); };
      stage.addEventListener('pointerdown', function (e) {
        if (e.target.closest('.node')) return;
        dragging = true; sx = e.clientX - tx; sy = e.clientY - ty; stage.classList.add('dragging');
      });
      window.addEventListener('pointermove', function (e) { if (!dragging) return; tx = e.clientX - sx; ty = e.clientY - sy; apply(); });
      window.addEventListener('pointerup', function () { dragging = false; stage.classList.remove('dragging'); });
      if (!document.documentElement.hasAttribute('data-stage')) {
        stage.addEventListener('wheel', function (e) {
          e.preventDefault();
          scale = Math.max(0.7, Math.min(2.2, scale + (e.deltaY < 0 ? 0.12 : -0.12)));
          apply();
        }, { passive: false });
      }
    })();
  </script>
</body>
</html>
