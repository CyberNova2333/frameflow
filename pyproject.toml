[project]
name = "frameflow"
version = "0.1.0"
description = "Cross-browser WebGPU & WebGL2 optical-flow AI frame generation for web emulators and canvas workloads"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }

[project.urls]
Repository = "https://github.com/CyberNova2333/frameflow"
dependencies = [
  "torch>=2.6",
  "torchvision>=0.21",
  "numpy>=1.26",
  "pillow>=10.0",
  "tqdm>=4.66",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["frameflow*"]
